{% extends "base.html" %}

{% block title %}Agregar Producto{% endblock %}

{% block content %}
<h2>Agregar Producto</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <div>
        {{ form.nombre.label }}<br>
        {{ form.nombre() }}
    </div>
    <div>
        {{ form.precio.label }}<br>
        {{ form.precio() }}
    </div>
    <div>
        {{ form.cantidad.label }}<br>
        {{ form.cantidad() }}
    </div>
    <button type="submit">Guardar</button>
</form>
{% endblock %}
