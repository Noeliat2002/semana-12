{% extends "base.html" %}

{% block title %}Usuarios{% endblock %}

{% block content %}
<h2>Lista de Usuarios</h2>
<a href="{{ url_for('usuario_form') }}" class="btn btn-primary mb-3">Agregar Usuario</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.id_usuario }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.mail }}</td>
            <td>
                <a href="{{ url_for('edit_usuario', id=usuario.id_usuario) }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{{ url_for('delete_usuario', id=usuario.id_usuario) }}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
