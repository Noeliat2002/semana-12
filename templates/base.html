<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventario{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="bg-primary text-white p-3">
        <h1>Inventario de Productos</h1>
        <nav>
            <a href="{{ url_for('index') }}" class="text-white me-3">Inicio</a>
            <a href="{{ url_for('productos') }}" class="text-white me-3">Productos</a>
            <a href="{{ url_for('usuarios') }}" class="text-white me-3">Usuarios</a>
            <a href="{{ url_for('facturas') }}" class="text-white me-3">Facturas</a>
            <a href="{{ url_for('contactos') }}" class="text-white me-3">Contactos</a>
            <a href="{{ url_for('datos') }}" class="text-white me-3">Datos</a>
            <a href="{{ url_for('reporte_pdf') }}" class="text-white">Reporte PDF</a>
        </nav>
    </header>
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
